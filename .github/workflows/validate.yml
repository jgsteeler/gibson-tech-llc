name: Validate site

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SHOW_DETAILED_HERO_CTA: ${{ vars.VITE_SHOW_DETAILED_HERO_CTA }}
      VITE_SHOW_DIRECT_EMAIL_CAPTURE: ${{ vars.VITE_SHOW_DIRECT_EMAIL_CAPTURE }}
      VITE_SHOW_PEN_TEST_SPRINT_PRICING: ${{ vars.VITE_SHOW_PEN_TEST_SPRINT_PRICING }}
      VITE_SHOW_FRACTIONAL_RETAINER: ${{ vars.VITE_SHOW_FRACTIONAL_RETAINER }}
      VITE_SHOW_AI_WORKSHOP_OFFERING: ${{ vars.VITE_SHOW_AI_WORKSHOP_OFFERING }}
      VITE_SHOW_CLOUD_MIGRATION_PACKAGES: ${{ vars.VITE_SHOW_CLOUD_MIGRATION_PACKAGES }}
      VITE_SHOW_DIVERGENT_FLOW_SHOWCASE: ${{ vars.VITE_SHOW_DIVERGENT_FLOW_SHOWCASE }}
      VITE_SHOW_WRENCHQ_SHOWCASE: ${{ vars.VITE_SHOW_WRENCHQ_SHOWCASE }}
      VITE_SHOW_SMALL_BUSINESS_CONSULTING: ${{ vars.VITE_SHOW_SMALL_BUSINESS_CONSULTING }}
      VITE_SHOW_INTERACTIVE_CALCULATOR: ${{ vars.VITE_SHOW_INTERACTIVE_CALCULATOR }}
      VITE_DIVERGENT_FLOW_URL: ${{ vars.VITE_DIVERGENT_FLOW_URL }}
      VITE_WRENCHQ_URL: ${{ vars.VITE_WRENCHQ_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build with production configuration
        run: npm exec --yes --package=netlify-cli@27.12.1 -- netlify build --offline --context production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Preserve browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve the validated site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Semgrep locally on the runner
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            semgrep/semgrep:1.181.0 \
            semgrep scan --config p/default --error --strict \
              --metrics off --disable-version-check /src

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan checked-out history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /src --redact --log-opts="HEAD" --exit-code 1
